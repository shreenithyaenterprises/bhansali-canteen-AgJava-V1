<div class="row">
    <!-- left column -->
    <div class="col-md-8">
      <!-- general form elements -->
      <div class="box box-info">
        <div class="box-header with-border">
          <h3 class="box-title">Site Master</h3>
        </div>
        <!-- /.box-header -->
        <!-- form start -->
        <form [formGroup]="SiteMasterForm" id="siteMaster" (ngSubmit)="Submit()">
          <div class="box-body">
            <div class="form-group">
              <label for="siteCode">Site Code</label>
              <input
                type="text"
                class="form-control"
                id="siteCode"
                placeholder="Site Code"
                formControlName="site_code" [ngClass]="{'locked': disable}" />
                <span class="text-danger"
                *ngIf="(site_code.touched || submitted) && site_code.errors?.required">
                Site Code is required
              </span>
            </div>
            <div class="form-group">
              <label for="siteName">Site Name</label>
              <input
                type="text"
                class="form-control"
                id="siteName"
                placeholder="Site Name"
                formControlName="site_name" />
                <span class="text-danger"
                *ngIf="(site_name.touched || submitted) && site_name.errors?.required">
                Site Name is required
              </span>
            </div>
          </div>
          <!-- /.box-body -->

          <div class="box-footer">
            <div class="form-group">
                <div class="col-xs-offset-8 col-sm-4">
                    <button type="submit" class="btn btn-primary btn-md mr-1" [disabled]="!SiteMasterForm.valid">
                        <span class="fa fa-save" aria-hidden="true"></span> Save
                    </button>
                    <button type="reset" class="btn btn-warning btn-md" (click)="reset()">
                        <span class="glyphicon glyphicon-refresh" aria-hidden="true"></span> Reset
                    </button>
                </div>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="col-md-4">
      <div class="box box-info">
        <div class="box-header with-border">
          <h3 class="box-title">Site List</h3>

        </div>
        <div class="box-body">
            <div class="table">
                <table class="table table-striped table-responsive table-condensed table-sm">
                  <thead>
                    <tr>
                      <th scope="col" class="text-left">Site Code</th>
                      <th scope="col" class="text-left">Site Name</th>
                      <th scope="col" class="text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <ng-container *ngFor="let data of SiteData; let i = index">
                      <tr>
                        <td>{{ data.site_code }}</td>
                        <td>{{ data.site_name }}</td>
                        <td class="text-center">
                          <div>
                            <!-- <button
                            type="button"
                            class="btn btn-default btn-xs mr-1"
                            (click)="viewData(data)">
                            <i class="fa fa-eye text-info"></i>
                           </button> -->
                            <a
                              class="mt-10 pointer mr-1"
                              (click)="editData(data)">
                              <i class="fa fa-edit text-warning"></i>
                           </a>
                            <a                           
                              class="mt-10 pointer"
                              (click)="confirmBox(data)">
                              <i class="fa fa-trash text-danger" aria-hidden="true"></i>
                            </a>
                          </div>
                         
                        </td>
                      </tr>
                    </ng-container>
                  </tbody>
                </table>
                <!-- <pagination-controls (pageChange)="p = $event"></pagination-controls> -->
              </div>
        </div>
      </div>
    </div>
  </div>
