              </div>
            </div>

            <!-- form start -->

                <!-- </form> -->
                <div class="responsive" style="overflow: auto; max-height: 350px;">
                    <div class="col-md-2 pull-right mb-2">
                        <input type="text" id="table-search" (keyup)="applyFilter($event.target.value)" class="form-control input-sm" placeholder="Search...">
                    </div>
                    <table class="table table-striped table-responsive table-condensed styled-table" id="visitor-report">
                        <thead>
                        <tr>
                            <th scope="col" class="text-left">#</th>
                            <th>Emp Code</th>
                            <th>Name</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Area</th>
                            <th>Department</th>
                            <th>Contractor</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr *ngFor="let data of rptFilterData; let i = index">
                            <td>{{i + 1}}</td>
                            <td>{{ data.emp_code }}</td>
                            <td>{{ data.name }}</td>
                            <td>{{ data.punch_date | date: 'dd-MM-yyyy'}}</td>
                            <td>{{ data.punch_time }}</td>
                            <td>{{ data.last_punch_status }}</td>
                            <td>{{ data.AREA_DESCRIPTION }}</td>
                            <td>{{ data.DEPARTMENT }}</td>
                            <td>{{ data.CONTNAME }}</td>
                        </tr>
                        </tbody>
                    </table> 
                </div>

                </div>
