<div class="row">
        <!-- left column -->
        <div class="col-md-8">
          <!-- general form elements -->
          <div class="box box-info">
            <div class="box-header with-border">
              <h3 class="box-title">Emergency Contact</h3>
            </div>
            <!-- /.box-header -->
            <!-- form start -->
            <form [formGroup]="emForm" id="emForm" (ngSubmit)="Submit()">
              <div class="box-body">
                <div class="form-group">
                  <label for="name">Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    placeholder="Name Code"
                    formControlName="name"/>
                    <span class="text-danger"
                    *ngIf="(name.touched || submitted) && name.errors?.required">
                     Name is required
                  </span>
                </div>
                <div class="form-group">
                  <label for="mobile_no">Contact No</label>
                  <input
                    type="text"
                    class="form-control"
                    id="mobile_no"
                    placeholder="Contact No"
                    formControlName="mobile_no" pattern="^[789]\d{9,9}$" />
                    <span class="text-danger"
                    *ngIf="(mobile_no.touched || submitted) && mobile_no.errors?.required">
                    Contact no is required
                  </span>
                </div>
                <div class="form-group">
                        <label for="assembly_point">Assembly Point</label>
                        <input
                          type="text"
                          class="form-control"
                          id="assembly_point"
                          placeholder="Assembly Point"
                          formControlName="assembly_point" />
                          <span class="text-danger"
                          *ngIf="(assembly_point.touched || submitted) && assembly_point.errors?.required">
                          Assembly Point is required
                        </span>
                </div>
                <div class="form-group">
                        <label for="shift">Shift</label>
                        <select id="shift" name="shift" class="select form-control" formControlName="shift">
                                <option *ngFor="let item of lstShift" [ngValue]="item.value">{{item.label}}</option>
                        </select>
                          <span class="text-danger"
                          *ngIf="(shift.touched || submitted) && shift.errors?.required">
                          Shift is required
                        </span>
                </div>
              </div>
              <!-- /.box-body -->
    
              <div class="box-footer">
                <div class="form-group">
                    <div class="col-xs-offset-8 col-sm-4">
                        <button type="submit" class="btn btn-primary btn-md mr-1" [disabled]="!emForm.valid">
                            <span class="fa fa-save" aria-hidden="true"></span> Save
                        </button>
                        <button type="reset" class="btn btn-warning btn-md">
                            <span class="glyphicon glyphicon-refresh" aria-hidden="true"></span> Reset
                        </button>
                    </div>
                </div>
  
              </div>
            </form>
          </div>
        </div>
        <div class="col-md-4">
          <div class="box box-info">
            <div class="box-header with-border">
              <h3 class="box-title">Contact List</h3>
    
            </div>
            <div class="box-body">
                <div class="table">
                    <table class="table table-striped table-responsive table-condensed table-sm">
                      <thead>
                        <tr>
                          <th scope="col" class="text-left">Name</th>
                          <th scope="col" class="text-left">Mobile</th>
                          <th scope="col" class="text-center">Shift</th>
                        </tr>
                      </thead>
                      <tbody>
                        <ng-container *ngFor="let data of emData; let i = index">
                          <tr>
                            <td>{{ data.name }}</td>
                            <td>{{ data.mobile_no }}</td>
                            <td>{{ data.shift }}</td>
                            <td class="text-center">
                              <div>
                                <button
                                  type="button"
                                  class="btn btn-default btn-xs mr-1 btn-warning"
                                  (click)="editData(data)">
                                  <i class="fa fa-edit text-warning"></i>
                                </button>
                                <button
                                  type="button" 
                                  class="btn btn-default btn-xs mr-1 btn-danger"
                                 (click)="deleteData(data)">
                                  <i class="fa fa-trash" aria-hidden="true"></i>
                                </button>
                              </div>
                             
                            </td>
                          </tr>
                        </ng-container>
                      </tbody>
                    </table>
                    <!-- <pagination-controls (pageChange)="p = $event"></pagination-controls> -->
                  </div>
            </div>
          </div>
        </div>
      </div>
