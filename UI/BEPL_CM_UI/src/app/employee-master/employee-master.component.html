<div class="row">
    <!-- left column -->
    <div class="col-md-8">
      <!-- general form elements -->
      <div class="box box-info">
        <div class="box-header with-border">
          <h3 class="box-title">Employee Master</h3>
        </div>
        <!-- /.box-header -->
        <!-- form start -->
        <form [formGroup]="EmployeeMasterForm" id="employeeMaster" (ngSubmit)="Submit()">
          <div class="box-body">
              <div class="row mb-2">
                <div class="col-md-4">
                  <label for="empcode">Employee Code</label>
                  <input type="text" class="form-control" [ngClass]="{'locked': disable}"  id="empcode" placeholder="Employee Code" formControlName="empcode" />
                      <span class="text-danger" *ngIf="(empcode.touched || submitted) && empcode.errors?.required">
                      Employee Code is required
                  </span>
                </div>
                <div class="col-md-4">
                  <label for="empcode">Enrollment No</label>
                  <input type="text" class="form-control" id="enrollment_number" placeholder="Enrollment No" formControlName="enrollment_number" />
                      <span class="text-danger" *ngIf="(enrollment_number.touched || submitted) && enrollment_number.errors?.required">
                      Enrollment No is required
                  </span>
                </div>
                <!-- <div class="col-md-2">
                    <label for="title">Title</label>
                    <select formControlName="title"  name="title" id="title" class="form-control">
                        <option value="" selected>---SELECT---</option>
                        <option [value]="item.code" *ngFor="let item of titleList">
                            {{ item.name }}</option>
                    </select>
                </div> -->
                <div class="col-md-4">
                  <label for="empname">Employee Name</label>
                  <input
                      type="text"
                      class="form-control "
                      id="empname"
                      placeholder="Employee Name"
                      formControlName="empname" />
                      <span class="text-danger"
                          *ngIf="(empname.touched || submitted) && empname.errors?.required">
                          Employee Name is required
                      </span>
                </div>
              </div>
              <div class="row mb-2">
              <div class="col-md-4">
                <label for="building">Gender</label>
                <select formControlName="gender"  name="gender" id="gender" class="form-control">
                    <option value="" selected>---SELECT---</option>
                    <option [value]="item.code" *ngFor="let item of genderList">
                        {{ item.name }}</option>
                </select>
                <!-- <span class="text-danger"
                *ngIf="(gender.touched || submitted) && gender.errors?.required">
                Gender is required
                </span> -->
                </div>
                <div class="col-md-4">
                <label for="dob">DOB</label>
                <input type="date" name="dob" formControlName="dob" class="form-control" />  
                <!-- <dp-date-picker dir="rtl" theme="dp-material" 
                    formControlName="dob" [config]="datePickerConfig" minDate="01/01/1950">
                </dp-date-picker> -->
                <!-- <span class="text-danger"
                   *ngIf="(dob.touched || submitted) && dob.errors?.required">
                    Date of Birth is required
                </span> -->
                </div>
              </div>
              <div class="row mb-2">
              <div class="col-md-4">
                <label for="doj">DOJ</label>
                <input type="date" name="doj" formControlName="doj"  class="form-control" /> 
                <!-- <dp-date-picker dir="rtl" theme="dp-material" 
                    formControlName="doj" [config]="datePickerConfig" minDate="01/01/1950">
                </dp-date-picker> -->
                </div>
                <div class="col-md-4">
                <label for="mobile">Mobile</label>
                <input
                    type="text"
                    class="form-control"
                    id="mobile"
                    placeholder="Mobile No"
                    formControlName="mobile" />
                    <!-- <span class="text-danger"
                      *ngIf="(mobile.touched || submitted) && mobile.errors?.required">
                      Mobile No is required
                  </span> -->
                </div>
                <div class="col-md-4">
                    <label for="state">Email Id</label>
                    <input
                        type="text"
                        class="form-control"
                        id="emailid"
                        placeholder="Email Id"
                        formControlName="emailid" />
                </div>
              </div>
              <div class="row mb-2" *ngIf="isEdit">
                <div class="col-md-4">
                    <label for="height_permit">Left</label>
                    <div class="form-group">
                        <label>
                            <input type="radio"  name="left" class="minimal" value="1" formControlName="left" checked>
                                Yes
                        </label>
                        <label>
                            <input type="radio"  name="left" class="minimal" value="0" formControlName="left">
                                No
                        </label>
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="hp_issue_date">Left Date</label>
                    <input type="date" name="hp_issue_date" formControlName="left_date" class="form-control" /> 
                </div>
              </div>
              <div class="row mb-2">

                
              </div>
              <div class="panel panel-default">
                <div class="panel-heading">Employee Clasification</div>
                <div class="panel-body">
                    <div class="row mb-2">
                        <div class="col-md-4">
                            <label for="site">Site</label>
                            <select formControlName="site"  name="site" id="site" class="form-control">
                                <option value="" selected>---SELECT---</option>
                                <option [value]="item.site_code" *ngFor="let item of siteList">
                                    {{ item.site_name }}</option>
                            </select>
                          </div>
                        <div class="col-md-4">
                          <label for="establishment">Establishment</label>
                          <select formControlName="establishment"  name="establishment" id="establishment" class="form-control">
                            <option value="" selected>---SELECT---</option>
                            <option [value]="item.code" *ngFor="let item of establishmentList">
                                {{ item.establishment }}</option>
                         </select>
                          </div>
                          <div class="col-md-4">
                          <label for="division">Division</label>
                          <select formControlName="division"  name="division" id="division" class="form-control">
                            <option value="" selected>---SELECT---</option>
                            <option [value]="item.division_code" *ngFor="let item of divisionList">
                                {{ item.division_name }}</option>
                          </select>
                          </div>
                      </div>
                      <div class="row mb-2">
                          <div class="col-md-4">
                            <label for="department">Department</label>
                            <select formControlName="department"  name="department" id="department" class="form-control">
                                <option value="" selected>---SELECT---</option>
                                <option [value]="item.dept_code" *ngFor="let item of departmentList">
                                    {{ item.dept_name }}</option>
                              </select>
                          </div>
                          <div class="col-md-4">
                            <label for="category">Category</label>
                            <select formControlName="category"  name="category" id="category" class="form-control">
                                <option value="" selected>---SELECT---</option>
                                <option [value]="item.category_code" *ngFor="let item of categoryList">
                                    {{ item.category_name }}</option>
                            </select>
                          </div>
                          <div class="col-md-4">
                            <label for="designation">Designation</label>
                            <select formControlName="designation"  name="designation" id="designation" class="form-control">
                                <option value="" selected>---SELECT---</option>
                                <option [value]="item.designation_code" *ngFor="let item of designationList">
                                    {{ item.designation_name }}</option>
                            </select>
                          </div>
                      </div>
                      <div class="row mb-2">
                        <div class="col-md-4">
                          <label for="grade">Grade</label>
                          <select formControlName="grade"  name="grade" id="grade" class="form-control">
                            <option value="" selected>---SELECT---</option>
                            <option [value]="item.grade_code" *ngFor="let item of gradeList">
                                {{ item.grade_name }}</option>
                         </select>
                        </div>
                        <div class="col-md-4">
                          <label for="contractor">Contractor</label>
                          <select formControlName="contractor"  name="contractor" id="contractor" class="form-control">
                            <option value="" selected>---SELECT---</option>
                            <option [value]="item.cont_code" *ngFor="let item of contractorList">
                                {{ item.cont_name }}</option>
                         </select>
                        </div>
                    </div>
                </div>
              </div>
            
          </div>
          <!-- /.box-body -->

          <div class="box-footer">
            <div class="form-group">
                <div class="col-sm-6 pull-right text-right">
                    <button type="submit" class="btn btn-primary btn-md mr-1" [disabled]="!EmployeeMasterForm.valid">
                        <span class="fa fa-save" aria-hidden="true"></span> Save
                    </button>
                    <button type="reset" class="btn btn-warning btn-md mr-1" (click)="Reset()">
                        <span class="fa fa-refresh" aria-hidden="true"></span> Reset
                    </button>
                    <button type="button" class="btn btn-success btn-md" (click)="showDialog()">
                        <span class="fa fa-file-excel-o" aria-hidden="true"></span> Upload
                    </button>
                </div>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="col-md-4">
      <div class="box box-info">
        <div class="box-header with-border">
          <h3 class="box-title">Employee List</h3>
          <div class="col-md-2 pull-right float-right">
              <a  (click)="exportexcel()" style="cursor: pointer;"><i class="fa fa-file-excel-o text-green search-box" style="font-size:20px;" aria-hidden="true"></i></a>
          </div>
          <div class="row">
            <div class="col-md-6 mt-2">
                <div class="form-group">
                    <label>
                        <input type="radio"  name="left" class="minimal" value="A" checked (change)="onChangeRB($event.target.value)">
                            Active
                    </label>
                    <label>
                        <input type="radio"  name="left" class="minimal" value="L" (change)="onChangeRB($event.target.value)">
                            Left
                    </label>
                </div>
            </div>
          </div>
        </div>
        <div class="box-body">
            <input type="text" id="table-search" (keyup)="applyFilter($event.target.value)" class="form-control input-sm" placeholder="Search...">
            <div class="table-responsive table-bordered table-sm table-stripped"  style="max-height:400px; overflow:auto;">
                <table class="table" id="employee-list">
                  <thead>
                    <tr>
                      <th scope="col" class="text-left">Code</th>
                      <th scope="col" class="text-left">Name</th>
                      <th scope="col" class="text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <ng-container *ngFor="let data of filteredData; let i = index">
                      <tr>
                        <td>{{ data.empcode }}</td>
                        <td>{{ data.empname }}</td>
                        <td>
                          <div>
                            <a  (click)="editData(data)" class="pointer mr-10">
                              <i class="fa fa-edit text-primary"></i>
                            </a>
                            <a  (click)="confirmBox(data)" class="pointer">
                              <i class="fa fa-trash text-danger" aria-hidden="true"></i>
                            </a>
                          </div>
                        </td>
                      </tr>
                    </ng-container>
                  </tbody>
                </table>
                <!-- <pagination-controls (pageChange)="p = $event"></pagination-controls> -->
            </div>
        </div>
      </div>
    </div>
  </div>
  
    <!-----Popup Box-->
    <p-dialog [(visible)]="dialogDisplay" (onHide)="cancel()" width="600" height="300">
        <p-header>
            <div class="col-md-6 pull-left float-left">
                Employee Upload
            </div>
        </p-header>
        <div class="row">
            <div class="col-md-12">
              <div class="box box-solid">
                <div class="box-header with-border">
                    <div class="col-md-6 pull-right text-right">
                        <a  href="./assets/template/EmployeeMaster.xlsx"  style="cursor: pointer;">Download Template</a>
                    </div>
                 </div>
                <div class="box-body">
                  <div class="col-md-12">
                      <input type="file" class="form-control" (change)="incomingfile($event)" placeholder="Upload file" accept=".xlsx">
                      <button type="button" class="btn btn-info" (click)="Upload()" >Upload</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        <p-footer>
        </p-footer>
    </p-dialog>
