<div class="row">
        <!-- left column -->
        <div class="col-md-8">
          <!-- general form elements -->
          <div class="box box-info">
            <div class="box-header with-border">
              <h3 class="box-title">Establishment Master</h3>
            </div>
            <!-- /.box-header -->
            <!-- form start -->
            <form [formGroup]="EstablsihmentForm" id="establishmentMaster" (ngSubmit)="Submit()">
              <div class="box-body">
                  <div class="row mb-2">
                    <div class="col-md-4">
                    <label for="code">Code</label>
                    <input
                        type="text"
                        class="form-control"
                        id="code"
                        placeholder=""
                        formControlName="code" [ngClass]="{'locked': disable}" />
                        <span class="text-danger"
                        *ngIf="(code.touched || submitted) && code.errors?.required">
                        Establishment Code is required
                    </span>
                    </div>
                    <div class="col-md-4">
                      <label for="Establishment">Establishment</label>
                      <input
                          type="text"
                          class="form-control"
                          id="Establishment"
                          placeholder=""
                          formControlName="establishment" />
                          <span class="text-danger"
                              *ngIf="(establishment.touched || submitted) && establishment.errors?.required">
                              Establishment Name is required
                          </span>
                    </div>
                  </div>
                  <div class="row mb-2">
                  <div class="col-md-4">
                    <label for="building">Building</label>
                    <input
                        type="text"
                        class="form-control"
                        id="building"
                        placeholder=""
                        formControlName="building"
                    />
                    </div>
                    <div class="col-md-4">
                    <label for="street">Street</label>
                    <input
                        type="text"
                        class="form-control"
                        id="street"
                        placeholder=""
                        formControlName="street"
                    />
                    </div>
                  </div>
                  <div class="row mb-2">
                  <div class="col-md-4">
                    <label for="city">City</label>
                    <input
                        type="text"
                        class="form-control"
                        id="city"
                        placeholder=""
                        formControlName="city" />
                        <span class="text-danger"
                          *ngIf="(city.touched || submitted) && city.errors?.required">
                          City is required
                        </span>
                    </div>
                    <div class="col-md-4">
                    <label for="district">District</label>
                    <input
                        type="text"
                        class="form-control"
                        id="district"
                        placeholder=""
                        formControlName="district" />
                        <span class="text-danger"
                          *ngIf="(district.touched || submitted) && district.errors?.required">
                          District is required
                      </span>
                    </div>
                  </div>
                  <div class="row mb-2">
                  <div class="col-md-4">
                    <label for="state">State</label>
                    <input
                        type="text"
                        class="form-control"
                        id="state"
                        placeholder=""
                        formControlName="state" />
                      <span class="text-danger"
                        *ngIf="(state.touched || submitted) && state.errors?.required">
                        State is required
                      </span>
                    </div>
                  <div class="col-md-4">
                    <label for="pincode">Pin Code</label>
                    <input
                        type="text"
                        class="form-control"
                        id="pincode"
                        placeholder=""
                        formControlName="pin_code" />
                      <span class="text-danger"
                        *ngIf="(pin_code.touched || submitted) && pin_code.errors?.required">
                        Pin Code is required
                      </span>
                  </div>
                  </div>
                  <div class="row mb-2">
                    <div class="col-md-4">
                      <label for="country">Country</label>
                      <input
                          type="text"
                          class="form-control"
                          id="country"
                          placeholder=""
                          formControlName="country" />
                      </div>
                      <div class="col-md-4">
                      <label for="email">Email Id</label>
                      <input
                          type="text"
                          class="form-control"
                          id="email_id"
                          placeholder=""
                          formControlName="email_id"
                      />
                      </div>
                  </div>
                  <div class="row mb-2">
                      <div class="col-md-8">
                        <label for="website">Website</label>
                        <input
                            type="text"
                            class="form-control"
                            id="website"
                            placeholder=""
                            formControlName="website"
                        />
                        </div>
    
                  </div>
              </div>
              <!-- /.box-body -->
    
              <div class="box-footer">
                <div class="form-group">
                    <div class="col-xs-offset-8 col-sm-4">
                        <button type="submit" class="btn btn-primary btn-md mr-1" [disabled]="!EstablsihmentForm.valid">
                            <span class="fa fa-save" aria-hidden="true"></span> Save
                        </button>
                        <button type="reset" class="btn btn-warning btn-md">
                            <span class="glyphicon glyphicon-refresh" aria-hidden="true"></span> Reset
                        </button>
                    </div>
                </div>
    
    
              </div>
            </form>
          </div>
        </div>
        <div class="col-md-4">
          <div class="box box-info">
            <div class="box-header with-border">
              <h3 class="box-title">Establishment List</h3>
    
            </div>
            <div class="box-body">
                <div class="table-responsive table-bordered table-sm table-stripped">
                    <table class="table">
                      <thead>
                        <tr>
                          <th scope="col" class="text-left">Code</th>
                          <th scope="col" class="text-left">Establishment</th>
                          <th scope="col" class="text-center">Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        <ng-container *ngFor="let data of EstablishmentData; let i = index">
                          <tr>
                            <td>{{ data.code }}</td>
                            <td>{{ data.establishment }}</td>
                            <td class="text-center">
                              <div>
                                <a
                                  class="pointer mr-10"
                                  (click)="editData(data)">
                                  <i class="fa fa-edit text-warning"></i>
                              </a>
                                <a
                                  class="pointer"
                                 (click)="confirmBox(data)">
                                  <i class="fa fa-trash text-danger" aria-hidden="true"></i>
                               </a>
                              </div>
                             
                            </td>
                          </tr>
                        </ng-container>
                      </tbody>
                    </table>
                    <!-- <pagination-controls (pageChange)="p = $event"></pagination-controls> -->
                  </div>
            </div>
          </div>
        </div>
      </div>
