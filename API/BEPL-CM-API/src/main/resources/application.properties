spring.datasource.url=jdbc:sqlserver://localhost;databaseName=BEPL_TimeBase_Canteen
spring.datasource.username=sa
spring.datasource.password=sne@1234

spring.jackson.mapper.accept-case-insensitive-properties=true

#spring jpa
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#Hikari Connection pooling
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.maximumPoolSize=100
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.poolName=SpringBootJPAHikariCP
spring.datasource.hikari.maxLifetime=2000000
spring.datasource.hikari.connectionTimeout=30000

#spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#Scheduling
cron.scheduled.datapull=* */60 * * * *
#Logging
logging.pattern.console=%clr(%d{yy-MM-dd E HH:mm:ss.SSS}){blue} %clr(%-5p) %clr(%logger{0}){blue} %clr(%m){faint}%n
logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type=TRACE
#Server
server.servlet.context-path=/KEC-CM-API
server.port=8081
spring.jackson.mapper.sort-properties-alphabetically=true
# Enable response compression
server.compression.enabled=true
# Minimum response where compression will kick in
server.compression.min-response-size=1024
# Mime types that should be compressed
server.compression.mime-types=application/json, text/html, text/xml, text/plain, text/css, text/javascript, application/javascript

